<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q-Readiness | Login</title>
  <meta name="description" content="Log in to your Q-Readiness dashboard.">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/i18n.js"></script>
  <style>.nav__link { color: var(--color-text); }</style>
</head>
<body>
  <nav class="nav nav--visible nav--solid" role="navigation">
    <a href="index.html" class="nav__brand"><span class="nav__brand-mark">Q</span><span>Q-Readiness</span></a>
    <div class="nav__menu">
      <a href="dashboard.html" class="nav__link">Dashboard</a>
      <a href="quantum-status.html" class="nav__link">Timeline</a>
      <a href="pricing.html" class="nav__link">Pricing</a>
      <a href="news.html" class="nav__link">News</a>
      <a href="standards.html" class="nav__link">Standards</a>
      <a href="faq.html" class="nav__link">FAQ</a>
      <select id="langSelect" class="nav__link" aria-label="Select language" style="background:transparent;border:0.5px solid var(--color-border);color:var(--color-text);font-family:var(--font-body);font-size:0.72rem;padding:4px 8px;cursor:pointer;margin-right:8px;" onchange="I18n.switchTo(this.value)"><option value="en">English</option><option value="ja" lang="ja">日本語</option></select>
      <a href="login.html" class="nav__link nav__cta btn btn--primary btn--small">Login</a>
    </div>
  </nav>

  <main>
    <section class="section section--dark section--grid" style="padding-top:120px;padding-bottom:60px;">
      <div class="container" style="max-width:460px;margin:0 auto;">
        <h1 class="quantum-page-title" style="text-align:center;">Login</h1>

        <div id="error" style="background:rgba(255,95,87,0.08);border:0.5px solid rgba(255,95,87,0.2);color:#FF5F57;padding:12px 16px;font-size:0.82rem;border-radius:var(--radius-sm);margin-bottom:16px;display:none;"></div>

        <form id="loginForm" style="display:flex;flex-direction:column;gap:16px;">
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="email" style="font-size:0.75rem;font-weight:400;color:var(--color-text-dim);letter-spacing:0.04em;text-transform:uppercase;">Email</label>
            <input id="email" type="email" required autocomplete="email" style="background:var(--color-base-alt);border:0.5px solid var(--color-border);padding:14px;font-family:var(--font-body);font-size:0.92rem;color:var(--color-text);outline:none;">
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="password" style="font-size:0.75rem;font-weight:400;color:var(--color-text-dim);letter-spacing:0.04em;text-transform:uppercase;">Password</label>
            <input id="password" type="password" required autocomplete="current-password" style="background:var(--color-base-alt);border:0.5px solid var(--color-border);padding:14px;font-family:var(--font-body);font-size:0.92rem;color:var(--color-text);outline:none;">
          </div>
          <button type="submit" class="btn btn--primary" style="width:100%;">Login</button>
        </form>
        <p style="text-align:center;font-size:0.82rem;color:var(--color-text-dim);margin-top:16px;">
          Don't have an account? <a href="signup.html" style="color:var(--color-accent);">Sign up</a>
        </p>
      </div>
    </section>

    <section class="section section--deep" style="padding:40px 0;">
      <div class="container">
        <footer class="footer">
          <span>&copy; 2026 Q-Readiness</span>
          <div class="footer__links">
            <a href="index.html">Home</a>
            <a href="pricing.html">Pricing</a>
            <a href="index.html#contact">Contact</a>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script src="js/firebase.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) { window.location.href = "dashboard.html"; }
    });

    const errorDiv = document.getElementById("error");
    const showError = (msg) => { errorDiv.textContent = msg; errorDiv.style.display = "block"; };

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.style.display = "none";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        if (err.code === "auth/invalid-credential") showError("Invalid email or password.");
        else if (err.code === "auth/user-not-found") showError("No account found with this email.");
        else if (err.code === "auth/too-many-requests") showError("Too many attempts. Try again later.");
        else showError(err.message);
      }
    });
  </script>
</body>
</html>
